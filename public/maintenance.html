<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<!-- Marker used by the poller: while the response still contains this, the app is still in maintenance -->
<meta name="x-maintenance-page" content="true" />
<title>Maintenance — IT Service Management</title>
<script>
  /* Sync with next-themes (storageKey="theme") before first paint */
  (() => {
    try {
      const stored = localStorage.getItem("theme");
      const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.add(dark ? "dark" : "light");
    } catch {}
  })();
</script>
<style>
:root{
  color-scheme:light dark;
  --bg:#ffffff; --bg-tint:#eef0fb; --card:rgba(255,255,255,.72);
  --fg:#17141d; --muted:#5d5d6b; --border:rgba(23,20,29,.12);
  --brand:#2c2742; --brand-2:#6366f1; --brand-3:#38bdf8; --brand-4:#a78bfa;
  --ok:#16a34a; --warn:#d97706;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 24px 60px rgba(44,39,66,.14);
}
.dark{
  color-scheme:dark;
  --bg:#0d0f14; --bg-tint:#151a26; --card:rgba(22,25,34,.68);
  --fg:#f4f5f8; --muted:#8e93a3; --border:rgba(255,255,255,.10);
  --brand:#00558d; --brand-2:#3b82f6; --brand-3:#22d3ee; --brand-4:#8b5cf6;
  --ok:#4ade80; --warn:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.55);
}
.light{color-scheme:light}
@media (prefers-color-scheme:dark){
  :root:not(.light){
    color-scheme:dark;
    --bg:#0d0f14; --bg-tint:#151a26; --card:rgba(22,25,34,.68);
    --fg:#f4f5f8; --muted:#8e93a3; --border:rgba(255,255,255,.10);
    --brand:#00558d; --brand-2:#3b82f6; --brand-3:#22d3ee; --brand-4:#8b5cf6;
    --ok:#4ade80; --warn:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 24px 60px rgba(0,0,0,.55);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,var(--bg-tint) 0%,var(--bg) 65%);
  color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:hidden;position:relative;
}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(70% 60% at 50% 50%,transparent 40%,color-mix(in srgb,var(--bg) 70%,transparent) 100%)}

.card{
  position:relative;z-index:2;width:100%;max-width:440px;
  padding:40px 36px 28px;text-align:center;
  background:var(--card);border:1px solid var(--border);border-radius:22px;
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:var(--shadow);
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card.leaving{animation:leave .5s ease forwards}
@keyframes leave{to{opacity:0;transform:translateY(-10px) scale(.98)}}

.logo{width:58px;height:78px;margin:0 auto 22px;display:block;
  filter:drop-shadow(0 10px 22px color-mix(in srgb,var(--brand-2) 40%,transparent));
  animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}

.pill{
  display:inline-flex;align-items:center;gap:8px;padding:5px 13px;margin-bottom:16px;
  border-radius:9999px;border:1px solid var(--border);font-size:12.5px;font-weight:600;
  background:color-mix(in srgb,var(--brand-2) 10%,transparent);
}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--brand-2);
  box-shadow:0 0 10px 1px color-mix(in srgb,var(--brand-2) 55%,transparent);transition:background .3s}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--brand-2) 60%,transparent);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}
[data-state="ready"] .dot{background:var(--ok)}
[data-state="offline"] .dot{background:var(--warn)}

h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.body{font-size:14.5px;line-height:1.65;color:var(--muted)}

.bar{position:relative;height:6px;margin:26px 8px 0;border-radius:9999px;overflow:hidden;
  background:color-mix(in srgb,var(--border) 100%,transparent)}
.bar-fill{position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--brand-4),var(--brand-2),var(--brand-3));
  transform-origin:left;transform:scaleX(0);transition:transform 1s linear}
[data-state="checking"] .bar-fill{transform:scaleX(1);animation:shimmer 1.1s ease-in-out infinite alternate}
[data-state="ready"] .bar-fill{transform:scaleX(1);background:var(--ok);transition:transform .4s,background .3s}
@keyframes shimmer{from{opacity:.45}to{opacity:1}}

.status{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;
  font-size:12.5px;color:var(--muted);min-height:28px;flex-wrap:wrap}
#statusText{font-variant-numeric:tabular-nums}
button.now{
  font:inherit;font-size:12px;font-weight:600;color:var(--fg);cursor:pointer;
  padding:4px 11px;border-radius:9999px;border:1px solid var(--border);background:transparent;
  transition:background .2s,border-color .2s}
button.now:hover{background:color-mix(in srgb,var(--brand-2) 14%,transparent);border-color:var(--brand-2)}
button.now:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
button.now:disabled{opacity:.5;cursor:default}

.foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);
  font-size:12px;font-weight:500;color:var(--muted);display:flex;justify-content:space-between}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
}
</style>
</head>
<body data-state="waiting">
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="card" id="card">
  <svg class="logo" viewBox="0 0 186 249" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transaction Manager">
    <title>diamond</title>
    <path d="M99,0 L0,155.5 L65.5,101 Z" fill="url(#paint0_linear)" />
    <path d="M95,95.5 L65.5,101 L99,0 Z" fill="url(#paint1_linear)" />
    <path d="M95,95.5 L65.5,101 L0,155.5 Z" fill="hsl(222, 90%, 63%)" />
    <path d="M95,95.5 L0,155.5 L185.5,95.5 Z" fill="url(#paint2_linear)" />
    <path d="M91,155.5 L185.5,95.5 L0,155.5 Z" fill="hsl(222, 90%, 43%)" />
    <path d="M87.5,249 L121,149.5 L185.5,95.5 Z" fill="url(#paint3_linear)" />
    <path d="M91,155.5 L121,149.5 L87.5,249 Z" fill="hsl(222, 80%, 73%)" />
    <path d="M91,155.5 L121,149.5 L185.5,95.5 Z" fill="hsl(222, 80%, 73%)" />
    <defs>
      <linearGradient id="paint0_linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="hsl(222, 90%, 33%)"/><stop offset="50%" stop-color="hsl(222, 90%, 63%)"/><stop offset="100%" stop-color="hsl(222, 60%, 97%)"/></linearGradient>
      <linearGradient id="paint1_linear" x1="0%" y1="50%" x2="100%" y2="50%"><stop offset="0%" stop-color="hsl(222, 90%, 63%)"/><stop offset="100%" stop-color="hsl(222, 70%, 88%)"/></linearGradient>
      <linearGradient id="paint2_linear" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stop-color="hsl(222, 80%, 73%)"/><stop offset="100%" stop-color="hsl(222, 90%, 63%)"/></linearGradient>
      <linearGradient id="paint3_linear" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="hsl(222, 90%, 33%)"/><stop offset="60%" stop-color="hsl(222, 90%, 63%)"/><stop offset="100%" stop-color="hsl(222, 60%, 97%)"/></linearGradient>
    </defs>
  </svg>

  <span class="pill"><span class="dot"></span><span id="pillText">Scheduled maintenance</span></span>
  <h1 id="title">We'll be right back</h1>
  <p class="body" id="msg">We're performing scheduled maintenance on the Transaction Manager platform. We're checking in the background and will take you back to the app the moment it's ready — no need to refresh.</p>

  <div class="bar" role="progressbar" aria-label="Checking availability"><span class="bar-fill"></span></div>

  <div class="status" aria-live="polite">
    <span id="statusText">Next check in 30s</span>
    <button class="now" id="checkNow" type="button">Check now</button>
  </div>

  <p class="foot"><span>Transaction Manager</span><span id="lastChecked">Not checked yet</span></p>
</main>

<script>
/* ============================================================
   1) AVAILABILITY WATCHER — no page reload, background keeps running
   ============================================================ */
(() => {
  const CHECK_EVERY = 30;            // seconds between checks
  const MAX_BACKOFF = 120;           // seconds, when the network is failing
  const TIMEOUT_MS = 8000;

  const $ = id => document.getElementById(id);
  const body = document.body, statusEl = $("statusText"), btn = $("checkNow");
  const last = $("lastChecked"), pill = $("pillText"), title = $("title"), msg = $("msg"), card = $("card");

  let remaining = CHECK_EVERY, busy = false, fails = 0, interval = CHECK_EVERY, done = false;
  const setState = s => body.dataset.state = s;

  const isBackUp = async () => {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
    try {
      /* Same URL the user is on; cache-busted so we never read a cached maintenance page */
      const url = location.pathname + location.search + (location.search ? "&" : "?") + "_mc=" + Date.now();
      const res = await fetch(url, { cache: "no-store", credentials: "same-origin", signal: ctl.signal, headers: { Accept: "text/html" } });
      if (!res.ok) return false;                       // 502/503/504 etc. => still down
      const html = await res.text();
      return !html.includes('name="x-maintenance-page"'); // maintenance page itself returned with 200 => still down
    } finally { clearTimeout(t); }
  };

  const check = async () => {
    if (busy || done) return;
    busy = true; btn.disabled = true;
    setState("checking"); statusEl.textContent = "Checking availability…";
    try {
      const up = await isBackUp();
      last.textContent = "Last checked " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      fails = 0; interval = CHECK_EVERY;
      if (up) return goBack();
      setState("waiting");
    } catch {
      fails++; interval = Math.min(MAX_BACKOFF, CHECK_EVERY * 2 ** Math.min(fails, 3));
      setState(navigator.onLine ? "waiting" : "offline");
      if (!navigator.onLine) statusEl.textContent = "You appear to be offline";
    } finally {
      busy = false; btn.disabled = false; remaining = interval; tick(true);
    }
  };

  const goBack = () => {
    done = true; setState("ready");
    pill.textContent = "All set"; title.textContent = "We're back!";
    msg.textContent = "Maintenance is complete. Taking you back to the app…";
    statusEl.textContent = "Redirecting…"; btn.hidden = true;
    setTimeout(() => card.classList.add("leaving"), 700);
    setTimeout(() => location.replace(location.pathname + location.search + location.hash), 1150);
  };

  const tick = (silent) => {
    if (done || busy) return;
    if (!silent) remaining--;
    if (remaining <= 0) return check();
    if (navigator.onLine) statusEl.textContent = "Next check in " + remaining + "s";
  };

  setInterval(() => { if (!document.hidden) tick(); }, 1000);
  btn.addEventListener("click", check);
  addEventListener("online", check);
  addEventListener("offline", () => { setState("offline"); statusEl.textContent = "You appear to be offline"; });
  /* Coming back to the tab: check right away instead of waiting out the timer */
  document.addEventListener("visibilitychange", () => { if (!document.hidden && remaining < CHECK_EVERY - 3) check(); });
})();

/* ============================================================
   2) BACKGROUND — "Silk flow": layered luminous ribbons + drifting motes
      • Time is stored in sessionStorage, so even a forced reload resumes the same frame
      • Pauses when tab hidden, respects reduced motion, adapts to theme live
   ============================================================ */
(() => {
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const KEY = "maint-bg-t";
  let W, H, dpr, raf = 0, last = 0, t = 0, motes = [], pal = [], isDark = false;
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };

  try { t = parseFloat(sessionStorage.getItem(KEY)) || Math.random() * 100; } catch { t = Math.random() * 100; }
  const save = () => { try { sessionStorage.setItem(KEY, String(t)); } catch {} };
  setInterval(save, 1000); addEventListener("pagehide", save);

  /* Resolve any CSS color (hex, hsl, color-mix) to "r,g,b" */
  const probe = document.createElement("canvas").getContext("2d");
  const rgbOf = v => {
    probe.clearRect(0, 0, 1, 1); probe.fillStyle = "#000"; probe.fillStyle = v; probe.fillRect(0, 0, 1, 1);
    const [r, g, b] = probe.getImageData(0, 0, 1, 1).data; return [r, g, b];
  };
  const readTheme = () => {
    const cs = getComputedStyle(document.documentElement);
    isDark = document.documentElement.classList.contains("dark") ||
      (!document.documentElement.classList.contains("light") && matchMedia("(prefers-color-scheme: dark)").matches);
    pal = ["--brand-2", "--brand-3", "--brand-4"].map(n => rgbOf(cs.getPropertyValue(n).trim()));
  };

  /* Ribbon definitions: each is a sum of sines with its own speed, colour and depth */
  const RIBBONS = [
    { y: .30, amp: .10, f: 1.2, s: .11, c: 0, th: .16, a: .55, par: 10 },
    { y: .42, amp: .13, f: .9,  s: .08, c: 1, th: .20, a: .45, par: 18 },
    { y: .56, amp: .11, f: 1.5, s: .13, c: 2, th: .15, a: .50, par: 26 },
    { y: .68, amp: .15, f: .7,  s: .07, c: 0, th: .22, a: .38, par: 34 },
    { y: .78, amp: .09, f: 1.8, s: .15, c: 1, th: .12, a: .42, par: 42 },
  ];

  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.max(30, Math.min(90, Math.round(W * H / 22000)));
    motes = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, z: Math.random(),
      vy: -(Math.random() * .18 + .05), ph: Math.random() * 6.28,
    }));
  };

  const waveY = (r, x, time) => {
    const k = x / W * Math.PI * 2 * r.f;
    return H * (r.y + r.amp * (
      Math.sin(k + time * r.s * 6) * .6 +
      Math.sin(k * 1.9 - time * r.s * 4.2 + 1.3) * .28 +
      Math.sin(k * 3.1 + time * r.s * 2.5 + 2.1) * .12));
  };

  const draw = (now) => {
    const dt = Math.min((now - last) / 1000 || 0, .05); last = now;
    if (!reduce.matches) t += dt;
    mouse.x += (mouse.tx - mouse.x) * .04; mouse.y += (mouse.ty - mouse.y) * .04;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = isDark ? "lighter" : "source-over";

    /* Ribbons */
    const step = Math.max(8, W / 140);
    for (const r of RIBBONS) {
      const [R, G, B] = pal[r.c], px = mouse.x * r.par, py = mouse.y * r.par * .6;
      const th = H * r.th;
      ctx.beginPath();
      for (let x = -step; x <= W + step; x += step) {
        const y = waveY(r, x, t) + py - th / 2 + Math.sin(x * .004 + t * .3) * 6;
        x === -step ? ctx.moveTo(x + px, y) : ctx.lineTo(x + px, y);
      }
      for (let x = W + step; x >= -step; x -= step) {
        const y = waveY(r, x, t + .9) + py + th / 2 + Math.cos(x * .005 - t * .25) * 8;
        ctx.lineTo(x + px, y);
      }
      ctx.closePath();
      const g = ctx.createLinearGradient(0, H * (r.y - r.amp), 0, H * (r.y + r.amp + r.th));
      const a = r.a * (isDark ? .17 : .13);
      g.addColorStop(0, `rgba(${R},${G},${B},0)`);
      g.addColorStop(.5, `rgba(${R},${G},${B},${a})`);
      g.addColorStop(1, `rgba(${R},${G},${B},0)`);
      ctx.fillStyle = g; ctx.fill();

      /* Glowing crest line */
      ctx.beginPath();
      for (let x = -step; x <= W + step; x += step) {
        const y = waveY(r, x, t) + py - th / 2 + Math.sin(x * .004 + t * .3) * 6;
        x === -step ? ctx.moveTo(x + px, y) : ctx.lineTo(x + px, y);
      }
      ctx.strokeStyle = `rgba(${R},${G},${B},${isDark ? .30 : .22})`; ctx.lineWidth = 1.2; ctx.stroke();
    }

    /* Motes: soft rising particles that twinkle */
    for (const m of motes) {
      if (!reduce.matches) {
        m.y += m.vy * (.4 + m.z) * 60 * dt; m.x += Math.sin(t * .5 + m.ph) * .12;
        if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
      }
      const [R, G, B] = pal[(m.ph * 3 | 0) % 3];
      const tw = .5 + .5 * Math.sin(t * 1.4 + m.ph * 5);
      const r = (.8 + m.z * 1.8);
      const x = m.x + mouse.x * (6 + m.z * 22), y = m.y + mouse.y * (6 + m.z * 22);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r * 5);
      g.addColorStop(0, `rgba(${R},${G},${B},${(isDark ? .55 : .4) * tw})`);
      g.addColorStop(1, `rgba(${R},${G},${B},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 5, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    raf = requestAnimationFrame(draw);
  };

  const start = () => { cancelAnimationFrame(raf); readTheme(); last = performance.now(); raf = requestAnimationFrame(draw); };

  addEventListener("resize", resize);
  addEventListener("pointermove", e => { mouse.tx = e.clientX / W - .5; mouse.ty = e.clientY / H - .5; }, { passive: true });
  document.addEventListener("visibilitychange", () => document.hidden ? (cancelAnimationFrame(raf), save()) : start());
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
  reduce.addEventListener("change", start);

  resize(); start();
})();
</script>
</body>
</html>
