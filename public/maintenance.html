<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Maintenance — IT Service Management</title>
<script>
  /* Sync with next-themes (storageKey="theme") before first paint to avoid a flash */
  (() => {
    try {
      const stored = localStorage.getItem("theme");
      const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.classList.add("dark");
      else document.documentElement.classList.add("light");
    } catch {}
  })();
</script>
<style>
:root{
  color-scheme:light dark;
  --bg:#ffffff; --bg-tint:#f5f5f5; --card:rgba(255,255,255,.82);
  --fg:#17141d; --muted:#606060; --border:#cccccc;
  --brand:#2c2742; --brand-2:#6366f1; --brand-3:#c3ebfe;
  --node:99,102,241;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 18px 50px rgba(44,39,66,.12);
}
.dark{
  color-scheme:dark;
  --bg:#191919; --bg-tint:#242424; --card:rgba(36,36,36,.80);
  --fg:#fbfbfb; --muted:#888888; --border:#454545;
  --brand:#00558d; --brand-2:#007acc; --brand-3:#7c4dff;
  --node:0,153,204;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 50px rgba(0,0,0,.45);
}
.light{color-scheme:light}
@media (prefers-color-scheme:dark){
  :root:not(.light){
    color-scheme:dark;
    --bg:#191919; --bg-tint:#242424; --card:rgba(36,36,36,.80);
    --fg:#fbfbfb; --muted:#888888; --border:#454545;
    --brand:#00558d; --brand-2:#007acc; --brand-3:#7c4dff;
    --node:0,153,204;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 18px 50px rgba(0,0,0,.45);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(120% 90% at 50% 0%,var(--bg-tint) 0%,var(--bg) 60%);
  color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:hidden;position:relative;
}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{
  position:absolute;width:52vmax;height:52vmax;border-radius:50%;
  filter:blur(90px);opacity:.22;will-change:transform;
}
.aurora i:nth-child(1){background:var(--brand-2);top:-20vmax;left:-14vmax;animation:d1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:var(--brand-3);bottom:-24vmax;right:-16vmax;animation:d2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){background:var(--brand);width:34vmax;height:34vmax;top:35%;left:55%;opacity:.14;animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vmax,-10vmax) scale(1.1)}}
@keyframes d3{to{transform:translate(-22vmax,8vmax) scale(.85)}}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

.card{
  position:relative;z-index:2;width:100%;max-width:440px;
  padding:40px 36px 30px;text-align:center;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:var(--shadow);
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.logo{width:58px;height:78px;margin:0 auto 22px;display:block;filter:drop-shadow(0 8px 18px color-mix(in srgb,var(--brand) 25%,transparent))}

.pill{
  display:inline-flex;align-items:center;gap:8px;padding:5px 13px;margin-bottom:16px;
  border-radius:9999px;border:1px solid var(--border);font-size:12.5px;font-weight:600;
  color:var(--fg);
  background:color-mix(in srgb,var(--brand-2) 10%,transparent);
}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--brand-2);box-shadow:0 0 10px 1px color-mix(in srgb,var(--brand-2) 55%,transparent)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--brand-2) 60%,transparent);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}

h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.body{font-size:14.5px;line-height:1.65;color:var(--muted)}

.bar{position:relative;height:6px;margin:26px 8px 0;border-radius:9999px;overflow:hidden;background:color-mix(in srgb,var(--border) 55%,transparent)}
.bar-fill{position:absolute;inset:0;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),var(--brand-2),color-mix(in srgb,var(--brand-2) 60%,white));animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}

.refresh{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.refresh svg{width:14px;height:14px;opacity:.8}
#countdown{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;font-weight:500;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="bg" aria-hidden="true"></canvas>

<main class="card">
  <svg class="logo" viewBox="0 0 186 249" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transaction Manager">
    <title>diamond</title>
    <path d="M99,0 L0,155.5 L65.5,101 Z" fill="url(#paint0_linear)" stroke="none" />
    <path d="M95,95.5 L65.5,101 L99,0 Z" fill="url(#paint1_linear)" stroke="none" />
    <path d="M95,95.5 L65.5,101 L0,155.5 Z" fill="hsl(222, 90%, 63%)" stroke="none" />
    <path d="M95,95.5 L0,155.5 L185.5,95.5 Z" fill="url(#paint2_linear)" stroke="none" />
    <path d="M91,155.5 L185.5,95.5 L0,155.5 Z" fill="hsl(222, 90%, 43%)" stroke="none" />
    <path d="M87.5,249 L121,149.5 L185.5,95.5 Z" fill="url(#paint3_linear)" stroke="none" />
    <path d="M91,155.5 L121,149.5 L87.5,249 Z" fill="hsl(222, 80%, 73%)" stroke="none" />
    <path d="M91,155.5 L121,149.5 L185.5,95.5 Z" fill="hsl(222, 80%, 73%)" stroke="none" />
    <defs>
      <linearGradient id="paint0_linear" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="hsl(222, 90%, 33%)" />
        <stop offset="50%" stop-color="hsl(222, 90%, 63%)" />
        <stop offset="100%" stop-color="hsl(222, 60%, 97%)" />
      </linearGradient>
      <linearGradient id="paint1_linear" x1="0%" y1="50%" x2="100%" y2="50%" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="hsl(222, 90%, 63%)" />
        <stop offset="100%" stop-color="hsl(222, 70%, 88%)" />
      </linearGradient>
      <linearGradient id="paint2_linear" x1="50%" y1="0%" x2="50%" y2="100%" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="hsl(222, 80%, 73%)" />
        <stop offset="100%" stop-color="hsl(222, 90%, 63%)" />
      </linearGradient>
      <linearGradient id="paint3_linear" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="hsl(222, 90%, 33%)" />
        <stop offset="60%" stop-color="hsl(222, 90%, 63%)" />
        <stop offset="100%" stop-color="hsl(222, 60%, 97%)" />
      </linearGradient>
    </defs>
  </svg>
  <span class="pill"><span class="dot"></span>Scheduled maintenance</span>
  <h1>We'll be right back</h1>
  <p class="body">We're performing scheduled maintenance on the Transaction Manager platform. This page refreshes automatically and will return you to the app as soon as we're ready.</p>
  <div class="bar" role="presentation"><span class="bar-fill"></span></div>
  <p class="refresh" aria-live="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    Refreshing automatically in <span id="countdown">30</span>s
  </p>
  <p class="foot">Transaction Manager</p>
</main>

<script>
(() => {
  /* Centralized auto-reload interval — change this value to adjust seconds */
  const RELOAD_INTERVAL_SECONDS = 30;
  const el = document.getElementById("countdown");
  let s = RELOAD_INTERVAL_SECONDS;
  el.textContent = s;
  setInterval(() => {
    if (--s <= 0) { location.reload(); return; }
    el.textContent = s;
  }, 1000);

  /* Constellation background */
  const cv = document.getElementById("bg");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const mouse = { x: -9999, y: -9999 };
  let W, H, dpr, nodes = [], raf = 0, rgb = "99,102,241";

  const readColor = () => {
    rgb = getComputedStyle(document.documentElement).getPropertyValue("--node").trim() || rgb;
  };

  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.max(24, Math.min(90, Math.round(W * H / 16000)));
    nodes = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
      r: Math.random() * 1.6 + .8,
    }));
  };

  const LINK = 140;
  const draw = () => {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      if (!reduce.matches) {
        a.x += a.vx; a.y += a.vy;
        if (a.x < -20) a.x = W + 20; else if (a.x > W + 20) a.x = -20;
        if (a.y < -20) a.y = H + 20; else if (a.y > H + 20) a.y = -20;
        const mx = a.x - mouse.x, my = a.y - mouse.y, md = mx * mx + my * my;
        if (md < 14400) { const f = (1 - Math.sqrt(md) / 120) * .6; a.x += mx * f * .02; a.y += my * f * .02; }
      }
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, d = dx * dx + dy * dy;
        if (d < LINK * LINK) {
          ctx.strokeStyle = `rgba(${rgb},${(1 - Math.sqrt(d) / LINK) * .35})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      ctx.fillStyle = `rgba(${rgb},.7)`;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.2832); ctx.fill();
    }
    if (!reduce.matches) raf = requestAnimationFrame(draw);
  };

  const start = () => { cancelAnimationFrame(raf); readColor(); draw(); };

  addEventListener("resize", () => { resize(); start(); });
  addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
  document.addEventListener("visibilitychange", () => document.hidden ? cancelAnimationFrame(raf) : start());
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", start);
  reduce.addEventListener("change", start);
  new MutationObserver(start).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

  resize(); start();
})();
</script>
</body>
</html>
