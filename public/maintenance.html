<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Maintenance — IT Service Management</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f4f7f7; --card:rgba(255,255,255,.78); --fg:#18181b; --muted:#65707a;
  --border:rgba(24,24,27,.10); --accent:#00a39d; --accent2:#00d4c9;
  --node:0,163,157; --shadow:0 1px 2px rgba(0,0,0,.04),0 16px 48px rgba(0,60,60,.10);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1416; --card:rgba(24,32,34,.72); --fg:#f3f7f7; --muted:#9aa8ad;
    --border:rgba(255,255,255,.10); --accent:#2dd4bf; --accent2:#5eead4;
    --node:45,212,191; --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 48px rgba(0,0,0,.4);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:hidden;position:relative;
}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{
  position:absolute;width:52vmax;height:52vmax;border-radius:50%;
  filter:blur(90px);opacity:.28;will-change:transform;
}
.aurora i:nth-child(1){background:var(--accent);top:-20vmax;left:-14vmax;animation:d1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){background:var(--accent2);bottom:-24vmax;right:-16vmax;animation:d2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){background:var(--accent);width:34vmax;height:34vmax;top:35%;left:55%;opacity:.16;animation:d3 38s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vmax,-10vmax) scale(1.1)}}
@keyframes d3{to{transform:translate(-22vmax,8vmax) scale(.85)}}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

.card{
  position:relative;z-index:2;width:100%;max-width:440px;
  padding:40px 36px 30px;text-align:center;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:var(--shadow);
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.logo{width:76px;height:76px;margin:0 auto 22px;display:block;border-radius:14px}

.pill{
  display:inline-flex;align-items:center;gap:8px;padding:5px 13px;margin-bottom:16px;
  border-radius:9999px;border:1px solid var(--border);font-size:12.5px;font-weight:600;
  background:color-mix(in srgb,var(--accent) 10%,transparent);
}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 1px color-mix(in srgb,var(--accent) 55%,transparent)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.4);opacity:0}}

h1{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.body{font-size:14.5px;line-height:1.65;color:var(--muted)}

.bar{position:relative;height:6px;margin:26px 8px 0;border-radius:9999px;overflow:hidden;background:var(--border)}
.bar-fill{position:absolute;inset:0;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,white));animation:slide 1.6s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(370%)}}

.refresh{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.refresh svg{width:14px;height:14px;opacity:.8}
#countdown{font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;font-weight:500;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
}
</style>
</head>

  const el = document.getElementById("countdown");
  let s = RELOAD_INTERVAL_SECONDS;
  el.textContent = s;
  setInterval(() => {
    if (--s <= 0) { location.reload(); return; }
    el.textContent = s;
  }, 1000);

  /* Constellation background */
  const cv = document.getElementById("bg");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const mouse = { x: -9999, y: -9999 };
  let W, H, dpr, nodes = [], raf = 0, rgb = "0,163,157";

  const readColor = () => {
    rgb = getComputedStyle(document.documentElement).getPropertyValue("--node").trim() || rgb;
  };

  const resize = () => {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.max(24, Math.min(90, Math.round(W * H / 16000)));
    nodes = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
      r: Math.random() * 1.6 + .8,
    }));
  };

  const LINK = 140;
  const draw = () => {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      if (!reduce.matches) {
        a.x += a.vx; a.y += a.vy;
        if (a.x < -20) a.x = W + 20; else if (a.x > W + 20) a.x = -20;
        if (a.y < -20) a.y = H + 20; else if (a.y > H + 20) a.y = -20;
        const mx = a.x - mouse.x, my = a.y - mouse.y, md = mx * mx + my * my;
        if (md < 14400) { const f = (1 - Math.sqrt(md) / 120) * .6; a.x += mx * f * .02; a.y += my * f * .02; }
      }
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, d = dx * dx + dy * dy;
        if (d < LINK * LINK) {
          ctx.strokeStyle = `rgba(${rgb},${(1 - Math.sqrt(d) / LINK) * .35})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      ctx.fillStyle = `rgba(${rgb},.7)`;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.2832); ctx.fill();
    }
    if (!reduce.matches) raf = requestAnimationFrame(draw);
  };

  const start = () => { cancelAnimationFrame(raf); readColor(); draw(); };

  addEventListener("resize", () => { resize(); start(); });
  addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
  document.addEventListener("visibilitychange", () => document.hidden ? cancelAnimationFrame(raf) : start());
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", start);
  reduce.addEventListener("change", start);

  resize(); start();
})();
</script>
</body>
</html>
